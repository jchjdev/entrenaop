name: entrenaop_trainer
description: Panel profesional para preparadores de EntrenaOP.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: 2.17.2
  # Ya resueltos por el proyecto: recuperación persistente y petición ligada al JWT capturado.
  shared_preferences: 2.5.5
  http: 1.6.0
  go_router: 18.0.1
  # Iconos de controles adaptativos; misma versión resuelta en ADMIN.
  cupertino_icons: 1.0.9
  # Descarga CSV del informe profesional; versión ya resuelta en los consumidores.
  web: 1.1.1
  trainer_access:
    path: ../packages/trainer_access
  entrena_ui:
    path: ../packages/entrena_ui
  # Misma receta y creador que ADMIN, sin copiar la autoría profesional.
  workout_core:
    path: ../packages/workout_core
  workout_editor_ui:
    path: ../packages/workout_editor_ui
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
