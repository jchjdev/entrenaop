name: entrenaop_trainer
description: Panel profesional para preparadores de EntrenaOP.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.17.2
  go_router: 18.0.1
  # Iconos de controles adaptativos; misma versión resuelta en ADMIN.
  cupertino_icons: 1.0.9
  trainer_access:
    path: ../packages/trainer_access
  entrena_ui:
    path: ../packages/entrena_ui
  # Misma receta y creador que ADMIN, sin copiar la autoría profesional.
  workout_core:
    path: ../packages/workout_core
  workout_editor_ui:
    path: ../packages/workout_editor_ui
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Cliente HTTP ya resuelto por Supabase; permite probar reintentos de Storage.
  http: 1.6.0
flutter:
  uses-material-design: true
