name: workout_editor_ui
description: "Controles compartidos para crear sesiones en EntrenaOP"
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image: ^4.10.1
  image_picker: ^1.2.3
  # Reutiliza reproducción y captura web ya fijadas en los consumidores.
  video_player: 2.14.0
  web: 1.1.1
  http: 1.6.0
  workout_core:
    path: ../workout_core
  # Tema, miniaturas y protección de salida existentes; sin paquetes externos nuevos.
  entrena_ui:
    path: ../entrena_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
