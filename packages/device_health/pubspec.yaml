name: device_health
description: Adaptador local de lectura explícita de carreras para EntrenaOP.
publish_to: none
version: 0.1.0
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  crypto: 3.0.7
  device_activity_core:
    path: ../device_activity_core
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: DeviceHealthPlugin
