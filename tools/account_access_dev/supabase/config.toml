# Configuración parcial: retornos y plantilla de recuperación de desarrollo.
# No usar el config.toml de supabase init para sobrescribir Auth remoto.
project_id = "entrenaop-account-access-dev"

[auth]
additional_redirect_urls = [
  "http://localhost:*/**",
  "http://127.0.0.1:*/**",
  "es.entrenaop://auth-callback/",
]

[auth.email.template.recovery]
subject = "Restablece tu contraseña de EntrenaOP"
content_path = "./supabase/templates/recovery.html"
