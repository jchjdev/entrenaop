name: entrenaop
description: "App de entrenamiento personal y preparación de oposiciones militares"
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Traducciones oficiales de los controles; ya presente de forma transitiva.
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^3.0.0

  # Navegación
  go_router: ^18.0.1

  # Inyección de dependencias
  get_it: ^9.2.1

  # Supabase
  supabase_flutter: ^2.17.2
  workout_core:
    path: packages/workout_core
  workout_editor_ui:
    path: packages/workout_editor_ui
  entrena_ui:
    path: packages/entrena_ui
  trainer_access:
    path: packages/trainer_access
  device_activity_core:
    path: packages/device_activity_core
  device_health:
    path: packages/device_health

  # Video
  video_player: ^2.14.0
  # Pitidos locales del ejecutor en web, Android e iOS (incluye soporte SPM).
  audioplayers: 6.8.1
  # Receptor propio de invitaciones; versión ya resuelta por Supabase.
  app_links: 7.2.1
  # Abrir enlaces de referencia que el reproductor integrado no admite.
  url_launcher: ^6.3.2

  # Utilidades
  intl: ^0.20.3
  uuid: ^4.6.0
  shared_preferences: ^2.2.3
  # Versión real del paquete instalado, también si se sobrescribe al compilar.
  package_info_plus: 10.2.2

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^4.0.0
  # Versiones ya presentes en el lockfile; caché acotada de clips oficiales.
  http: 1.6.0
  crypto: 3.0.7
  path_provider: 2.1.6

  # Compras nativas: primera integración limitada a Test Store móvil debug Dev.
  purchases_flutter: 10.15.2
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/workout/
    - assets/programs/tropa/initial_week_draft_v1.json
    - assets/programs/fas_periodic_2027/assessment_reference_v1.json
