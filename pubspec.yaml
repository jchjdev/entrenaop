name: entrenaop
description: "App de entrenamiento personal y preparación de oposiciones militares"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^3.0.0

  # Navegación
  go_router: ^18.0.1

  # Inyección de dependencias
  get_it: ^9.2.1

  # Supabase
  supabase_flutter: ^2.17.2
  workout_core:
    path: packages/workout_core

  # Video
  video_player: ^2.14.0

  # Utilidades
  intl: ^0.20.3
  uuid: ^4.6.0
  shared_preferences: ^2.2.3

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  assets:
    - assets/programs/tropa/initial_week_draft_v1.json
