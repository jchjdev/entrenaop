name: entrenaop
description: "App de entrenamiento personal y preparación de oposiciones militares"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^3.0.0

  # Navegación
  go_router: ^18.0.1

  # Inyección de dependencias
  get_it: ^9.2.1

  # Supabase
  supabase_flutter: ^2.17.2
  workout_core:
    path: packages/workout_core
  workout_editor_ui:
    path: packages/workout_editor_ui
  entrena_ui:
    path: packages/entrena_ui

  # Video
  video_player: ^2.14.0
  # Pitidos locales del ejecutor en web, Android e iOS (incluye soporte SPM).
  audioplayers: 6.8.1
  # Abrir enlaces de referencia que el reproductor integrado no admite.
  # Ya se resuelve esta versión a través de Supabase; no añade un plugin nuevo.
  url_launcher: ^6.3.2

  # Utilidades
  intl: ^0.20.3
  uuid: ^4.6.0
  shared_preferences: ^2.2.3

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1

  # Ya transitiva de Supabase; permite probar Auth con respuestas de red simuladas.
  http: ^1.6.0
flutter:
  uses-material-design: true
  assets:
    - assets/audio/workout/
    - assets/programs/tropa/initial_week_draft_v1.json
    - assets/programs/fas_periodic_2027/assessment_reference_v1.json
