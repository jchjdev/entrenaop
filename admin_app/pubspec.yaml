name: entrenaop_admin
description: "Panel web de administración de EntrenaOP"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.17.2
  go_router: 18.0.1
  cupertino_icons: ^1.0.8
  # Versiones ya resueltas en la app: selección y subida directa, sin SDK de Bunny.
  image_picker: 1.2.3
  http: 1.6.0
  video_player: 2.14.0
  workout_core:
    path: ../packages/workout_core
  workout_editor_ui:
    path: ../packages/workout_editor_ui
  entrena_ui:
    path: ../packages/entrena_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
