name: Publicar ADMIN Dev

on:
  push:
    branches: [main]
    paths:
      - 'admin_app/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'tools/static_web_release.py'
      - '.github/workflows/admin-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-dev
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      revision: ${{ github.sha }}
      publish_required: ${{ steps.scope.outputs.publish_required }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: SDK Flutter oficial fijado y verificado
        shell: bash
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/flutter.tar.xz" https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.5-stable.tar.xz
          echo "2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolver dependencias bloqueadas
        run: |
          flutter pub get --enforce-lockfile
          cd admin_app
          flutter pub get --enforce-lockfile
          cd ../trainer_app
          flutter pub get --enforce-lockfile
          cd ../packages/device_activity_core
          dart pub get --enforce-lockfile
          cd ../../labs/health_read_probe
          flutter pub get --enforce-lockfile
      - name: Validar dominio puro de dispositivos
        working-directory: packages/device_activity_core
        run: |
          dart format --output=none --set-exit-if-changed lib test
          dart analyze --fatal-infos
          dart test
          bash tool/test_ci_scope.sh
      - name: Detectar cambios compartidos
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo 'athlete=true' >> "$GITHUB_OUTPUT"
            echo 'publish_required=true' >> "$GITHUB_OUTPUT"
          else
            changed_files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            if printf '%s\n' "$changed_files" | grep -Eq '^(packages/|pubspec\.(yaml|lock)$|analysis_options\.yaml$)'; then
              echo 'athlete=true' >> "$GITHUB_OUTPUT"
            else
              echo 'athlete=false' >> "$GITHUB_OUTPUT"
            fi
            # El dominio y el ensayo aislados no se consumen en ADMIN.
            if printf '%s\n' "$changed_files" | grep -Eq '^(packages/device_activity_core/|labs/health_read_probe/)' &&
               ! printf '%s\n' "$changed_files" | grep -Ev '^(packages/device_activity_core/|labs/health_read_probe/|docs/|\.github/workflows/(admin-dev|health-read-probe)\.yml$)' | grep -q .; then
              echo 'publish_required=false' >> "$GITHUB_OUTPUT"
            else
              echo 'publish_required=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Validar aplicación del deportista si cambia código compartido
        if: steps.scope.outputs.athlete == 'true'
        run: |
          flutter analyze
          flutter test
      - name: Validar ADMIN
        working-directory: admin_app
        run: |
          flutter analyze
          flutter test
      - name: Probar el publicador
        run: python3 -m unittest discover -s admin_app/tool/tests -v
      - name: Probar el paquete profesional
        run: python3 -m unittest discover -s trainer_app/tool/tests -v
      - name: Compilar ADMIN exclusivamente con Dev
        working-directory: admin_app
        run: flutter build web --release --csp --no-web-resources-cdn --no-source-maps --no-wasm-dry-run --dart-define=APP_ENV=development --dart-define=APP_REVISION=${{ github.sha }} --dart-define=SUPABASE_URL=https://sxbxfjqgoddzhtcyhalw.supabase.co
      - name: Preparar versión aislada
        run: python3 admin_app/tool/admin_release.py package
      - name: Conservar el paquete validado
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-dev-${{ github.sha }}
          path: admin_app/build/admin-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && needs.validate.outputs.publish_required == 'true' && vars.ADMIN_DEV_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: admin-dev
      url: https://admin.entrenaop.es/
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: admin-dev-${{ github.sha }}
          path: admin_app/build/admin-release
      - name: Publicar y comprobar HTTPS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOSTINGER_ADMIN_FTPS_USER: ${{ secrets.HOSTINGER_ADMIN_FTPS_USER }}
          HOSTINGER_ADMIN_FTPS_PASSWORD: ${{ secrets.HOSTINGER_ADMIN_FTPS_PASSWORD }}
        run: python3 admin_app/tool/admin_release.py deploy
      - name: Resultado
        run: echo 'ADMIN Dev publicado y verificado en https://admin.entrenaop.es/' >> "$GITHUB_STEP_SUMMARY"

  retain-packages:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Este job no recibe credenciales de Hostinger ni de Supabase. El permiso
    # de escritura de Actions se limita al job de retención de compilados.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Conservar cinco compilados recientes y la versión publicada
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 admin_app/tool/admin_artifact_retention.py --apply
