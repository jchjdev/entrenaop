name: Verificar ensayo aislado de Salud

on:
  push:
    branches: [main]
    paths:
      - 'labs/health_read_probe/**'
      - 'packages/device_activity_core/**'
      - '.github/workflows/health-read-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: labs/health_read_probe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: SDK Flutter oficial fijado y verificado
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/flutter.tar.xz" https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.5-stable.tar.xz
          echo "2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolver, analizar y probar
        run: |
          flutter config --jdk-dir "$JAVA_HOME_17_X64"
          flutter pub get --enforce-lockfile
          bash tool/test_prepare_iphone.sh
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - name: Compilar Android sin publicar
        run: flutter build apk --debug --no-pub

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: labs/health_read_probe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: SDK Flutter oficial fijado y verificado
        run: |
          if [ "$(uname -m)" = arm64 ]; then
            archive=flutter_macos_arm64_3.47.5-stable.zip
            hash=d4dd908b5f8f65515831b6d68ae33307a813f2b68947dded7a1994ee5ea7cead
          else
            archive=flutter_macos_3.47.5-stable.zip
            hash=a7893bb0feecd8bd066f4f7e850356f896a6fc3b862e6c506d21c76691a66b72
          fi
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/flutter.zip" "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/$archive"
          echo "$hash  $RUNNER_TEMP/flutter.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/flutter.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Compilar iOS para simulador sin firmar ni publicar
        run: |
          flutter pub get --enforce-lockfile
          flutter build ios --simulator --debug --no-codesign --no-pub
