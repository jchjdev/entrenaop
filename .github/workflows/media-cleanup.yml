name: Verificar limpieza de medios sin borrar archivos

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/media_cleanup.ts'
      - 'supabase/functions/_shared/exercise_video.ts'
      - 'supabase/functions/_shared/exercise_video_config.ts'
      - 'supabase/functions/trainer-media-cleanup/**'
      - 'supabase/functions/tests/media_cleanup_test.ts'
      - 'supabase/functions/tests/exercise_video_test.ts'
      - '.github/workflows/media-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      # Solo transporte y proveedores simulados: sin credenciales ni archivos reales.
      - name: Confirmación externa, reintentos, permisos y cercado de subidas
        run: node --test supabase/functions/tests/media_cleanup_test.ts supabase/functions/tests/exercise_video_test.ts
      - name: Comprobar tipos del trabajador y las subidas
        run: >-
          npm exec --yes --package=typescript@5.9.3 -- tsc
          --noEmit --strict --target es2022 --lib es2023,dom,dom.iterable
          --module esnext --moduleResolution bundler --allowImportingTsExtensions
          supabase/functions/_shared/media_cleanup.ts
          supabase/functions/_shared/exercise_video.ts
